<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Property | Gurugram</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- Hero Section -->
    <header class="relative h-screen flex items-center justify-center bg-slate-900 text-white overflow-hidden">
        <div class="absolute inset-0 opacity-50 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1600&q=80');"></div>
        <div class="relative z-10 text-center px-4">
            <h1 class="text-5xl md:text-7xl font-light tracking-tight mb-4">The Modern Estate</h1>
            <p class="text-lg md:text-xl text-slate-300 mb-8 max-w-2xl mx-auto">Luxury living redefined in the heart of Gurgaon's growth corridor.</p>
            <a href="#inquiry" class="bg-white text-slate-900 px-8 py-4 rounded-md font-bold uppercase tracking-widest hover:bg-slate-200 transition">Express Interest</a>
        </div>
    </header>

    <!-- Lead Form Section -->
    <section id="inquiry" class="py-24 px-4">
        <div class="max-w-xl mx-auto bg-white p-10 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold mb-2">Request a Callback</h2>
                <p class="text-slate-500">Submit your details to receive the floor plans and pricing.</p>
            </div>
            
            <form id="lead-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2">Full Name</label>
                    <input type="text" name="full_name" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Email Address</label>
                    <input type="email" name="email" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">Phone Number</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-4 rounded-lg font-bold text-lg hover:bg-black transition-all">Submit Details</button>
            </form>

            <div id="success-msg" class="hidden text-center py-10">
                <div class="text-blue-600 text-5xl mb-4">✓</div>
                <h3 class="text-2xl font-bold">Thank You!</h3>
                <p class="text-slate-500 mt-2">Our team will reach out to you within 24 hours.</p>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center text-slate-400 text-sm border-t">
        © 2026 Real Estate Developer | RERA Registered
    </footer>

    <script src="script.js"></script>
</body>
</html>
